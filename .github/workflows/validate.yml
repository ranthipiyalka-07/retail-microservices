name: validate-config
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: YAML syntax
        run: |
          pip install --quiet yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' .
      - name: Secrets in the history
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.21.2 detect --source=/repo --no-banner --redact
      - name: Passwords must be encrypted or come from the environment
        run: |
          pattern='^[[:space:]]*[a-z.-]*(password|secret|api-key|private-key|aes-key|token):[[:space:]]*[^[:space:]]'
          bad=$(grep -nEH "$pattern" ./*.yml | grep -vE '\{cipher\}|\$\{|ci-allow' || true)
          if [ -n "$bad" ]; then
            echo "Plaintext secrets. Encrypt them with /encrypt, read them from the environment, or add '# ci-allow' to a harmless default:"
            echo "$bad"
            exit 1
          fi