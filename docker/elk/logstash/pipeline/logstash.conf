input {
  beats { port => 5044 }
}

filter {
  # Every service writes one ECS JSON object per line. Filebeat ships the raw line in [message].
  if [message] =~ /^\s*\{/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }

  mutate { remove_field => ["agent", "input"] }

  # Audit events (auditAction is set by the Audit API and the access filters) get their own index and retention.
  if [auditAction] {
    mutate { add_field => { "[@metadata][target_index]" => "retail-audit" } }
  } else {
    mutate { add_field => { "[@metadata][target_index]" => "retail-logs" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    data_stream => "false"
    index => "%{[@metadata][target_index]}-%{+YYYY.MM.dd}"
    manage_template => false          # the templates come from elk-init
  }
}